name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch exact repository revision without external actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer ${GITHUB_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/${GITHUB_SHA}" --output repository.zip
          unzip -q repository.zip
          mv adpadinc-brinkeradvisor-rates-claude-* source
      - name: Verify fixed remote-only package and manifests
        working-directory: source
        run: node --test test/package.test.mjs
